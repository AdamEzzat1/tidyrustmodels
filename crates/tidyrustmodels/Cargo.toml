[package]
name = "tidyrustmodels"
description = "tidymodels-inspired ML framework in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tidyrustmodels-core = { workspace = true }
tidyrustmodels-recipes = { workspace = true }
tidyrustmodels-models = { workspace = true }
tidyrustmodels-resample = { workspace = true }
tidyrustmodels-metrics = { workspace = true }
tidyrustmodels-workflows = { workspace = true }
tidyrustmodels-tune = { workspace = true }
tidyrustmodels-workflowsets = { workspace = true }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
approx = { workspace = true }

[features]
# Arrow interop (ADR-0003 / ADR-0015): `tidyrustmodels::arrow` converts RecordBatch <-> Table column-wise
arrow = ["dep:arrow-array", "dep:arrow-schema"]
