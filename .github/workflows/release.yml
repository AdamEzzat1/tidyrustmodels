name: Release packaging

# Builds the Python wheels (Linux, Windows, macOS) and the sdist with maturin, checks
# that every workspace crate packages, and renders the Rust API documentation. Runs on
# version tags and on demand. Nothing is published: artifacts are attached to the run
# for a human to inspect and upload. This workflow has been defined but, at the time
# of the 0.1.0 release candidate, not yet executed (ROADMAP.md Phase 6).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python3.11
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install numpy pandas pytest
          python -m pip install --no-index --find-links dist tidyrustmodels
          python -c "import tidyrustmodels as trm; print(trm.Table.from_dict({'x': [1.0, 2.0]}))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  crates:
    name: Crate packaging and API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package every workspace crate (dry run, dependency order)
        run: |
          for c in core recipes models resample metrics workflows tune workflowsets; do
            cargo package -p tidyrustmodels-$c --no-verify --allow-dirty
          done
          cargo package -p tidyrustmodels --no-verify --allow-dirty
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc
