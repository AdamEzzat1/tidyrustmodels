[package]
name = "tidyrustmodels-python"
description = "PyO3 bindings for tidyrustmodels"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Standalone root: the extension module is built by maturin, not by the workspace,
# so `cargo test --workspace` never needs a Python interpreter.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
tidyrustmodels = { path = "../../crates/tidyrustmodels" }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
numpy = "0.29.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[profile.release]
lto = "fat"
codegen-units = 1
