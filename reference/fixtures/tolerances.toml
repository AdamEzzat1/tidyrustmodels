# Numerical tolerances for the differential suite, per (level, quantity, task).
# Every entry carries a justification. Loosening a value requires editing this file in a
# reviewed change; tests fail rather than relax tolerances silently.
#
# `rel` = relative tolerance |a - b| <= rel * max(|a|, |b|); `abs` = absolute tolerance.
# A comparison passes if EITHER bound holds. Discrete outputs are compared exactly.

[defaults]
# Level 1: fitted preprocessing statistics and baked values. Both systems compute the
# same closed-form means/sds/medians in f64; differences come from summation order and
# jsonlite's 15-significant-digit output.
prep_stats_rel = 1e-12
prep_stats_abs = 1e-12
baked_rel = 1e-11
baked_abs = 1e-11

# Level 2: metric implementations on identical inputs (closed forms).
metrics_fixed_rel = 1e-12
metrics_fixed_abs = 1e-12

# Level 3: OLS coefficients. R uses LINPACK/LAPACK QR (dqrls); linfa uses an SVD-based
# least squares; smartcore SVD. Agreement is bounded by cond(X'X) * eps. Per-task
# overrides below cite the measured condition number from the fixture (`xtx_condition`).
ols_coef_rel = 1e-8
ols_pred_rel = 1e-8
ols_pred_abs = 1e-8

# Level 3: logistic coefficients. R: IRLS to relative deviance change 1e-8. Rust: L-BFGS
# to gradient tolerance 1e-8 * n (scale-aware), followed by a framework gradient check.
# First run (2026-10-12, VERIFICATION.md Phase 4): max relative difference 1.6e-8
# (smartcore, penguins_clf), 1.3e-8 (linfa, iris_clf); probabilities max abs 8.3e-9.
# Bound tightened from the provisional 1e-6 to 1e-7 (6x margin over the measured maximum).
logistic_coef_rel = 1e-7
logistic_prob_abs = 1e-7

# Level 3: multinomial coefficients and probabilities. R: nnet's BFGS on the same
# objective stopped at reltol = 1e-15 (maxit 10000); Rust native: Newton-Raphson to a
# relative deviance change of 1e-10. First run (2026-10-12, VERIFICATION.md Phase 8c):
# deviances agree to 2.4e-15 relative on every engine and ours is never above nnet's,
# while coefficients differ by up to 3.5e-7 relative and probabilities by 2e-8 absolute
# on every engine alike, i.e. the residual is nnet's position on a flat objective, not
# the Rust solvers'. Bounds are ~3x the measured maxima (tightened from the provisional
# 1e-5 / 1e-6 / 1e-8).
multinom_coef_rel = 1e-6
multinom_prob_abs = 1e-7
multinom_deviance_rel = 1e-13

# Level 3/4: decision trees (rpart port). The algorithm is deterministic and ported
# operation for operation (including rpart's quicksort tie order and the altered-prior
# round-off), so node structure, counts and directions are compared exactly and the
# floating-point quantities (split points, deviances, means, class shares, cp,
# predictions) to round-off. First run (2026-10-12, VERIFICATION.md Phase 8d): max
# 1.3e-14 relative over 5 tasks, 25 fold trees and all predictions; bounds are ~8x the
# measured maximum (tightened from the provisional 1e-10).
tree_frame_rel = 1e-13
tree_frame_abs = 1e-13
tree_pred_rel = 1e-13
tree_pred_abs = 1e-13
tree_prob_abs = 1e-13

# Boosted trees (Phase 8f), measured 2026-10-13. The port mirrors xgboost's float32
# arithmetic, so margins, predictions and probabilities agree EXACTLY (max 0) on the
# five tasks; the tree values differ only by xgboost's JSON printing of floats with
# ~8 significant digits (max 1.40e-7 relative). Classification tasks get a one-ulp
# allowance on exp-dependent quantities for other platforms' expf (R and Rust share
# the C runtime's expf on Windows, where 0 was measured); see the task tables.
xgb_tree_rel = 2e-7
xgb_tree_abs = 1e-6
xgb_pred_rel = 0.0
xgb_pred_abs = 0.0
xgb_prob_abs = 0.0
# workflows' sparsity estimate: R counts zeros on a random sample of 1000 rows when
# the data is larger, Rust on every row; the decision itself is compared exactly.
sparsity_estimate_abs = 2e-2

# Level 5: stochastic models (random forests). R and Rust each fit S seeds; a metric
# passes when |mean_R - mean_Rust| <= rf_z * sqrt(var_R/S + var_Rust/S), and the
# seed-averaged test predictions pass when at least rf_row_fraction of the rows are
# within the same band row-wise. rf_z = 4 keeps the false-failure rate per comparison
# near 6e-5 under the normal approximation; it is a detection threshold for a
# systematic difference between the two implementations, not a round-off bound.
rf_z = 4.0
rf_row_fraction = 0.98

# Level 4: per-fold metrics inherit the level-3 bound of the task; summary mean/std_err
# are plain arithmetic over per-fold values.
resample_metric_rel = 1e-7
resample_metric_abs = 1e-7
summary_rel = 1e-7
summary_abs = 1e-7

# Engine-specific bounds: `<engine>_<key>` overrides `<key>` for that engine only.
# native: the same algorithms as R (dqrdc2 pivoted QR for lm, glm.fit IRLS with the
# deviance criterion), so differences are summation-order round-off. First measured run
# (2026-10-12, VERIFICATION.md Phase 7): coefficients max 3.3e-13 rel (ames_reg, OLS and
# logistic alike), predictions 5.4e-15 rel, probabilities 4.0e-15 abs, fold/summary
# metrics <= 7e-14 rel, `converged` and classes exact. Bounds are >= 30x the measured
# maxima.
native_ols_coef_rel = 1e-11
native_ols_pred_rel = 1e-13
native_ols_pred_abs = 1e-9
native_logistic_coef_rel = 1e-11
native_logistic_prob_abs = 1e-13
native_resample_metric_rel = 1e-12
native_resample_metric_abs = 1e-12
native_summary_rel = 1e-12
native_summary_abs = 1e-12

[tasks.ames_reg]
# Wide dummy design (Neighborhood has 28 levels) with Sale_Price in the 1e5 range; the
# fixture records xtx_condition. Bound set after the first measured run; see
# VERIFICATION.md Phase 4 record for the measured value.
ols_coef_rel = 1e-7
ols_pred_rel = 1e-9

# Multiclass tasks: metrics inherit the multinomial probability residual of nnet (see
# above), on the native engine as well, so its exact-arithmetic overrides do not apply.
# Measured maxima (Phase 8c): fold/summary metrics 3.5e-7 rel / 1.4e-8 abs
# (penguins_species std_err), test-set metrics 5.5e-9 rel.
[tasks.synth_multi]
resample_metric_rel = 1e-6
resample_metric_abs = 1e-7
summary_rel = 1e-6
summary_abs = 1e-7
native_resample_metric_rel = 1e-6
native_resample_metric_abs = 1e-7
native_summary_rel = 1e-6
native_summary_abs = 1e-7

[tasks.penguins_species]
resample_metric_rel = 1e-6
resample_metric_abs = 1e-7
summary_rel = 1e-6
summary_abs = 1e-7
native_resample_metric_rel = 1e-6
native_resample_metric_abs = 1e-7
native_summary_rel = 1e-6
native_summary_abs = 1e-7

# Boosted-tree classification tasks: logistic / softprob gradients and outputs go
# through expf; measured 0 on Windows (shared C runtime), one float ulp allowed for
# platforms whose expf rounds differently (2e-7 relative, 1e-6 absolute).
[tasks.synth_clf_xgb]
xgb_pred_rel = 2e-7
xgb_pred_abs = 1e-6
xgb_prob_abs = 1e-6
resample_metric_rel = 1e-6
resample_metric_abs = 1e-6
native_resample_metric_rel = 1e-6
native_resample_metric_abs = 1e-6

[tasks.synth_multi_xgb]
xgb_pred_rel = 2e-7
xgb_pred_abs = 1e-6
xgb_prob_abs = 1e-6
resample_metric_rel = 1e-6
resample_metric_abs = 1e-6
native_resample_metric_rel = 1e-6
native_resample_metric_abs = 1e-6

[tasks.penguins_species_xgb]
xgb_pred_rel = 2e-7
xgb_pred_abs = 1e-6
xgb_prob_abs = 1e-6
resample_metric_rel = 1e-6
resample_metric_abs = 1e-6
native_resample_metric_rel = 1e-6
native_resample_metric_abs = 1e-6
